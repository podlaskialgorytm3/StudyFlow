<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="q1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="q2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="q3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="q4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#grad1)" />
  
  <!-- Matrix Grid Container -->
  <g transform="translate(96, 96)">
    <!-- Q1 Top-Left (Urgent & Important) -->
    <rect x="0" y="0" width="144" height="144" rx="24" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="72" cy="72" r="32" fill="url(#q1)" />
    
    <!-- Q2 Top-Right (Important & Not Urgent) -->
    <rect x="176" y="0" width="144" height="144" rx="24" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="248" cy="72" r="32" fill="url(#q2)" />
    
    <!-- Q3 Bottom-Left (Not Important & Urgent) -->
    <rect x="0" y="176" width="144" height="144" rx="24" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="72" cy="248" r="32" fill="url(#q3)" />
    
    <!-- Q4 Bottom-Right (Not Important & Not Urgent) -->
    <rect x="176" y="176" width="144" height="144" rx="24" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="248" cy="248" r="32" fill="url(#q4)" />
  </g>
</svg>

