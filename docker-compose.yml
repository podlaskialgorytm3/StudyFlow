services:
  postgres:
    image: postgres:16-alpine
    container_name: studyflow_postgres
    restart: always
    environment:
      POSTGRES_USER: studyflow
      POSTGRES_PASSWORD: studyflow_password
      POSTGRES_DB: studyflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

